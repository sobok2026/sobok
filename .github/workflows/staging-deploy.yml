name: Staging Deploy

run-name: Automatically release staging @ ${{ github.sha }}

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobok-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify staging release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Validate release branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != 'refs/heads/staging' ]; then
            echo 'Staging releases must run from the staging branch.' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Verify workspace
        uses: ./.github/actions/verify-workspace

      - name: Assert no generated-file drift
        run: git diff --exit-code

  schema:
    name: Push ${{ matrix.product }} staging schema
    needs: verify
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - product: accounts
            directory: apps/accounts
            migrator_secret: ACCOUNTS_MIGRATOR_URL
          - product: stella
            directory: apps/stella
            migrator_secret: STELLA_MIGRATOR_URL
          - product: vibe
            directory: apps/vibe
            migrator_secret: VIBE_MIGRATOR_URL
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Push product schema with Drizzle
        working-directory: ${{ matrix.directory }}
        env:
          CI: 'true'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/supabase/prod-ca-2021.crt
          SOBOK_MIGRATOR_URL: ${{ secrets[matrix.migrator_secret] }}
        run: bunx --bun drizzle-kit push --config drizzle.config.ts

  oauth-client:
    name: Bootstrap Stella staging OAuth client
    needs: schema
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap fixed Stella client
        uses: ./.github/actions/bootstrap-stella-oauth-client
        with:
          target: staging
          accounts_migrator_url: ${{ secrets.ACCOUNTS_MIGRATOR_URL }}
          stella_oidc_client_secret: ${{ secrets.STELLA_OIDC_CLIENT_SECRET }}

  payments:
    name: Deploy payments
    needs: oauth-client
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Payments Worker
        uses: ./.github/actions/deploy-payments
        with:
          target: staging
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  database:
    name: Deploy Database Worker
    needs: payments
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Database Worker
        uses: ./.github/actions/deploy-database
        with:
          target: staging
          accounts_google_client_id: ${{ vars.ACCOUNTS_GOOGLE_CLIENT_ID }}
          accounts_kakao_client_id: ${{ vars.ACCOUNTS_KAKAO_CLIENT_ID }}
          accounts_bbaton_client_id: ${{ vars.ACCOUNTS_BBATON_CLIENT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  accounts:
    name: Deploy Accounts
    needs: database
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Accounts
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/accounts'
          directory: apps/accounts
          target: staging
          turnstile_site_key: ${{ vars.ACCOUNTS_TURNSTILE_SITE_KEY }}
          accounts_google_client_id: ${{ vars.ACCOUNTS_GOOGLE_CLIENT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  stella:
    name: Deploy Stella
    needs: [database, accounts]
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Stella
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/stella'
          directory: apps/stella
          target: staging
          turnstile_site_key: ${{ vars.STELLA_TURNSTILE_SITE_KEY }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  vibe:
    name: Deploy Vibe
    needs: database
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Vibe
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/vibe'
          directory: apps/vibe
          target: staging
          turnstile_site_key: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
          vibe_pay_profile: staging
          verify_export: 'true'
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
