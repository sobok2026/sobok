name: Staging Deploy

run-name: Automatically release staging @ ${{ github.sha }}

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sobok-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify staging release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    outputs:
      accounts: ${{ steps.release_scope.outputs.accounts }}
      civil: ${{ steps.release_scope.outputs.civil }}
      database: ${{ steps.release_scope.outputs.database }}
      oauth_client: ${{ steps.release_scope.outputs.oauth_client }}
      payments: ${{ steps.release_scope.outputs.payments }}
      prepare: ${{ steps.release_scope.outputs.prepare }}
      stella: ${{ steps.release_scope.outputs.stella }}
      vibe: ${{ steps.release_scope.outputs.vibe }}
    steps:
      - name: Validate release branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != 'refs/heads/staging' ]; then
            echo 'Staging releases must run from the staging branch.' >&2
            exit 1
          fi

      # A complete, blob-filtered history lets Turborepo compare against the last successful release without
      # downloading historical asset contents. A shallow clone would conservatively mark every package affected.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Verify workspace
        uses: ./.github/actions/verify-workspace

      - name: Assert no generated-file drift
        run: git diff --exit-code

      - name: Resolve affected staging release scope
        id: release_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          accounts=false
          civil=false
          database=false
          oauth_client=false
          payments=false
          stella=false
          vibe=false
          full_release=false
          base_sha=''
          reason='affected packages since the last successful staging release'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            full_release=true
            reason='manual workflow dispatch'
          else
            base_sha="$(
              gh api \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$REPOSITORY/actions/workflows/staging-deploy.yml/runs?branch=staging&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""'
            )"

            if [ -z "$base_sha" ]; then
              full_release=true
              reason='no previous successful staging release'
            elif ! git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"; then
              full_release=true
              reason='previous successful release is not an ancestor of the current revision'
            elif ! git diff --quiet "$base_sha" "$HEAD_SHA" -- \
              .github/actions \
              .github/workflows/staging-deploy.yml \
              certs/supabase/prod-ca-2021.crt \
              package.json \
              turbo.json; then
              full_release=true
              reason='release orchestration or global build configuration changed'
            fi
          fi

          if [ "$full_release" = true ]; then
            accounts=true
            civil=true
            database=true
            oauth_client=true
            payments=true
            stella=true
            vibe=true
            scope='all deployable packages'
          else
            affected_packages="$(
              TURBO_SCM_BASE="$base_sha" TURBO_SCM_HEAD="$HEAD_SHA" \
                bunx turbo run type --affected --only --dry=json |
                jq -c '.packages'
            )"

            has_package() {
              jq -e --arg package "$1" 'index($package) != null' <<<"$affected_packages" >/dev/null
            }

            if has_package '@sobok/accounts'; then
              accounts=true
              oauth_client=true
            fi
            if has_package '@sobok/civil'; then
              civil=true
              oauth_client=true
            fi
            if has_package '@sobok/database'; then database=true; fi
            if has_package '@sobok/payments-service'; then payments=true; fi
            if has_package '@sobok/stella'; then
              stella=true
              oauth_client=true
            fi
            if has_package '@sobok/vibe'; then vibe=true; fi

            scope="$(jq -r 'if length == 0 then "none" else join(", ") end' <<<"$affected_packages")"
          fi

          if [ "$accounts" = true ] || [ "$civil" = true ] || [ "$stella" = true ] || [ "$vibe" = true ]; then
            prepare=true
          else
            prepare=false
          fi

          {
            echo "accounts=$accounts"
            echo "civil=$civil"
            echo "database=$database"
            echo "oauth_client=$oauth_client"
            echo "payments=$payments"
            echo "prepare=$prepare"
            echo "stella=$stella"
            echo "vibe=$vibe"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Staging release scope'
            echo
            echo "- Reason: $reason"
            echo "- Base: ${base_sha:-not applicable}"
            echo "- Packages: $scope"
            echo
            echo '| Target | Release |'
            echo '| --- | --- |'
            echo "| Accounts | $accounts |"
            echo "| Civil | $civil |"
            echo "| Database | $database |"
            echo "| OAuth client | $oauth_client |"
            echo "| Payments | $payments |"
            echo "| Stella | $stella |"
            echo "| Vibe | $vibe |"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Prepare affected staging products
    needs: verify
    if: needs.verify.outputs.prepare == 'true'
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Push Accounts schema with Drizzle
        if: needs.verify.outputs.accounts == 'true'
        working-directory: apps/accounts
        env:
          CI: 'true'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/supabase/prod-ca-2021.crt
          SOBOK_MIGRATOR_URL: ${{ secrets.ACCOUNTS_MIGRATOR_URL }}
        run: bunx --bun drizzle-kit push --config drizzle.config.ts

      - name: Push Stella schema with Drizzle
        if: needs.verify.outputs.stella == 'true'
        working-directory: apps/stella
        env:
          CI: 'true'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/supabase/prod-ca-2021.crt
          SOBOK_MIGRATOR_URL: ${{ secrets.STELLA_MIGRATOR_URL }}
        run: bunx --bun drizzle-kit push --config drizzle.config.ts

      - name: Push Civil schema with Drizzle
        if: needs.verify.outputs.civil == 'true'
        working-directory: apps/civil
        env:
          CI: 'true'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/supabase/prod-ca-2021.crt
          SOBOK_MIGRATOR_URL: ${{ secrets.CIVIL_MIGRATOR_URL }}
        run: bunx --bun drizzle-kit push --config drizzle.config.ts

      - name: Push Vibe schema with Drizzle
        if: needs.verify.outputs.vibe == 'true'
        working-directory: apps/vibe
        env:
          CI: 'true'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/supabase/prod-ca-2021.crt
          SOBOK_MIGRATOR_URL: ${{ secrets.VIBE_MIGRATOR_URL }}
        run: bunx --bun drizzle-kit push --config drizzle.config.ts

      - name: Bootstrap fixed Stella client
        if: needs.verify.outputs.oauth_client == 'true'
        uses: ./.github/actions/bootstrap-oauth-client
        with:
          target: staging
          accounts_migrator_url: ${{ secrets.ACCOUNTS_MIGRATOR_URL }}
          client_id: stella-web
          client_name: Stella
          client_origin: https://stella-stg.sobok.cc
          client_secret: ${{ secrets.STELLA_OIDC_CLIENT_SECRET }}

      - name: Bootstrap fixed Civil client
        if: needs.verify.outputs.oauth_client == 'true'
        uses: ./.github/actions/bootstrap-oauth-client
        with:
          target: staging
          accounts_migrator_url: ${{ secrets.ACCOUNTS_MIGRATOR_URL }}
          client_id: civil-web
          client_name: Civil
          client_origin: https://civil-stg.sobok.cc
          client_secret: ${{ secrets.CIVIL_OIDC_CLIENT_SECRET }}

  payments:
    name: Deploy payments
    needs: [verify, prepare]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        needs.verify.outputs.payments == 'true'
      }}
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Payments Worker
        uses: ./.github/actions/deploy-payments
        with:
          target: staging
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  database:
    name: Deploy Database Worker
    needs: [verify, prepare, payments]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        (needs.payments.result == 'success' || needs.payments.result == 'skipped') &&
        needs.verify.outputs.database == 'true'
      }}
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Database Worker
        uses: ./.github/actions/deploy-database
        with:
          target: staging
          accounts_google_client_id: ${{ vars.ACCOUNTS_GOOGLE_CLIENT_ID }}
          accounts_kakao_client_id: ${{ vars.ACCOUNTS_KAKAO_CLIENT_ID }}
          accounts_bbaton_client_id: ${{ vars.ACCOUNTS_BBATON_CLIENT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  accounts:
    name: Deploy Accounts
    needs: [verify, prepare, payments, database]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        (needs.payments.result == 'success' || needs.payments.result == 'skipped') &&
        (needs.database.result == 'success' || needs.database.result == 'skipped') &&
        needs.verify.outputs.accounts == 'true'
      }}
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Accounts
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/accounts'
          directory: apps/accounts
          target: staging
          turnstile_site_key: ${{ vars.ACCOUNTS_TURNSTILE_SITE_KEY }}
          accounts_google_client_id: ${{ vars.ACCOUNTS_GOOGLE_CLIENT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  civil-compute:
    name: Deploy Civil compute
    needs: [verify, prepare, payments, database]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        (needs.payments.result == 'success' || needs.payments.result == 'skipped') &&
        (needs.database.result == 'success' || needs.database.result == 'skipped') &&
        needs.verify.outputs.civil == 'true'
      }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Civil compute Worker and Container
        uses: ./.github/actions/deploy-civil-compute
        with:
          target: staging
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  stella:
    name: Deploy Stella
    needs: [verify, prepare, payments, database, accounts]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        (needs.payments.result == 'success' || needs.payments.result == 'skipped') &&
        (needs.database.result == 'success' || needs.database.result == 'skipped') &&
        (needs.accounts.result == 'success' || needs.accounts.result == 'skipped') &&
        needs.verify.outputs.stella == 'true'
      }}
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Stella
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/stella'
          directory: apps/stella
          target: staging
          turnstile_site_key: ${{ vars.STELLA_TURNSTILE_SITE_KEY }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  civil:
    name: Deploy Civil
    needs: [verify, prepare, payments, database, accounts, civil-compute]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        (needs.payments.result == 'success' || needs.payments.result == 'skipped') &&
        (needs.database.result == 'success' || needs.database.result == 'skipped') &&
        (needs.accounts.result == 'success' || needs.accounts.result == 'skipped') &&
        (needs.civil-compute.result == 'success' || needs.civil-compute.result == 'skipped') &&
        needs.verify.outputs.civil == 'true'
      }}
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Civil
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/civil'
          directory: apps/civil
          target: staging
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  vibe:
    name: Deploy Vibe
    needs: [verify, prepare, payments, database]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
        (needs.payments.result == 'success' || needs.payments.result == 'skipped') &&
        (needs.database.result == 'success' || needs.database.result == 'skipped') &&
        needs.verify.outputs.vibe == 'true'
      }}
    environment: staging
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Vibe
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/vibe'
          directory: apps/vibe
          target: staging
          turnstile_site_key: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
          vibe_pay_profile: staging
          verify_export: 'true'
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
