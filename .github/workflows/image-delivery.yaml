name: Image Delivery

# Build each service's arm64 image and push to GHCR. Deployment is pull-based:
# 6개 빌드가 전부 성공하면 promote-images가 단조증가 태그 main-<commit epoch>-<sha>를
# 원자적으로 부여하고, sobok-ops의 Flux image automation이 그 태그를 골라 digest 핀을
# 커밋한다 — 이 워크플로는 sobok-ops를 건드리지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-web-image:
    name: Build and publish web image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/sobok-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load public web build arguments from overlay
        id: load_public_env
        shell: bash
        run: |
          set -euo pipefail
          public_env_file="apps/web/public.env"

          if [ ! -f "$public_env_file" ]; then
            echo "public.env not found: $public_env_file" >&2
            exit 1
          fi

          tmp="$(mktemp)"
          while IFS= read -r line; do
            if [[ "$line" =~ ^(#|[[:space:]]*$) ]]; then
              continue
            fi

            if [[ ! "$line" =~ ^NEXT_PUBLIC_[A-Z0-9_]+=.*$ ]]; then
              echo "public.env must contain only NEXT_PUBLIC_* assignments, blank lines, or comments." >&2
              echo "$line" >&2
              exit 1
            fi

            printf '%s\n' "$line" >> "$tmp"
          done < "$public_env_file"

          if [ ! -s "$tmp" ]; then
            echo "No NEXT_PUBLIC_* entries found in $public_env_file" >&2
            exit 1
          fi

          echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
          cat "$tmp" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate web image metadata
        id: metadata_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
            ${{ steps.load_public_env.outputs.build_args }}
          secrets: |
            APP_POSTGRES_URL=${{ secrets.APP_POSTGRES_URL }}
            "APP_POSTGRES_CERTIFICATE=${{ secrets.APP_POSTGRES_CERTIFICATE }}"
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.metadata_web.outputs.tags }}
          labels: ${{ steps.metadata_web.outputs.labels }}

  build-and-publish-api-image:
    name: Build and publish api image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/sobok-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate api image metadata
        id: metadata_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.metadata_api.outputs.tags }}
          labels: ${{ steps.metadata_api.outputs.labels }}

  build-and-publish-chat-image:
    name: Build and publish chat image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_CHAT: ghcr.io/${{ github.repository_owner }}/sobok-chat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate chat image metadata
        id: metadata_chat
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHAT }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish chat image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/chat/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_chat.outputs.tags }}
          labels: ${{ steps.metadata_chat.outputs.labels }}

  build-and-publish-chat-worker-image:
    name: Build and publish chat-worker image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_CHAT_WORKER: ghcr.io/${{ github.repository_owner }}/sobok-chat-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate chat-worker image metadata
        id: metadata_chat_worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHAT_WORKER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish chat-worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/chat-worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_chat_worker.outputs.tags }}
          labels: ${{ steps.metadata_chat_worker.outputs.labels }}

  build-and-publish-chat-push-image:
    name: Build and publish chat-push image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_CHAT_PUSH: ghcr.io/${{ github.repository_owner }}/sobok-chat-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate chat-push image metadata
        id: metadata_chat_push
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_CHAT_PUSH }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish chat-push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/chat-push/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_chat_push.outputs.tags }}
          labels: ${{ steps.metadata_chat_push.outputs.labels }}

  build-and-publish-billing-worker-image:
    name: Build and publish billing-worker image
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BILLING_WORKER: ghcr.io/${{ github.repository_owner }}/sobok-billing-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate billing-worker image metadata
        id: metadata_billing_worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BILLING_WORKER }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish billing-worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/billing-worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata_billing_worker.outputs.tags }}
          labels: ${{ steps.metadata_billing_worker.outputs.labels }}

  promote-images:
    name: Promote images
    if: ${{ github.ref_name == 'main' }}
    needs:
      - build-and-publish-web-image
      - build-and-publish-api-image
      - build-and-publish-chat-image
      - build-and-publish-chat-worker-image
      - build-and-publish-chat-push-image
      - build-and-publish-billing-worker-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 재빌드 없이 sha 태그 매니페스트에 승격 태그만 부여한다. 커밋 epoch 기반이라
      # 재실행에도 값이 불변이고, Flux ImagePolicy가 이 숫자를 정렬해 최신을 고른다.
      # 6개 빌드가 전부 성공한 뒤에만 실행되므로 서비스 간 버전 스큐가 없다
      - name: Tag images for promotion
        shell: bash
        run: |
          set -euo pipefail
          tag="main-$(git show -s --format=%ct HEAD)-$(git rev-parse --short=7 HEAD)"
          for image in sobok-web sobok-api sobok-chat sobok-chat-worker sobok-chat-push sobok-billing-worker; do
            ref="ghcr.io/${{ github.repository_owner }}/${image}"
            docker buildx imagetools create --tag "${ref}:${tag}" "${ref}:${{ github.sha }}"
          done
          echo "promoted: ${tag}"
