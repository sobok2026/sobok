name: Vibe Deploy

# 배포는 세 가지 사건에서만 일어난다.
#
#   main 푸시        → 프로덕션 `vibe`
#   PR에 `stg` 라벨  → 스테이징 `vibe-stg`
#   수동 실행        → 스테이징 `vibe-stg`
#
# **PR을 여는 것만으로는 아무 데도 배포되지 않는다.** 그게 이 파일의 핵심이고 이유는 둘이다.
#
# ① 겹침. 이전에는 PR 트리거와 수동 실행이 똑같이 `deploy --env stg`를 돌려 같은 워커의 active
#    deployment를 덮어썼고, concurrency 그룹이 `staging` 리터럴 하나라 cancel-in-progress가 남의 PR
#    배포를 실행 도중에 취소하기까지 했다. 스테이징은 복제할 수 없는 자원이다 — PortOne 웹훅 URL은
#    스토어의 설정 모드당 하나뿐이고 Turnstile 핀은 배포당 호스트 하나뿐이라, 워커를 늘려도 결제
#    경로는 따라오지 않는다. 그래서 답은 환경을 늘리는 게 아니라 점유를 명시하는 것이다: 라벨이 곧
#    점유권이고, 한 번에 한 PR만 가질 수 있다(`Claim the staging lane` 스텝이 강제한다).
#
# ② 크레덴셜. `pull_request`는 PR 브랜치의 워크플로 파일을 그대로 실행한다. 그 job이 Cloudflare
#    토큰을 쥐고 있으면 PR 하나가 자기 사본에서 `--env stg`만 지워도 실연동 워커에 닿는다.
#    Cloudflare의 `Workers Scripts: Edit`은 스크립트 단위로 좁힐 수 없고 wrangler에는 OIDC 경로도
#    없으니, 토큰을 좁히는 게 아니라 **토큰을 만지는 job을 좁히는 것**이 유일하게 확실한 방어다.
#
#    이 파일이 실제로 보장하는 것과 보장하지 않는 것을 정확히 적어 둔다. 과장하면 다음 사람이 없는
#    보호를 믿는다.
#      • 보장: 아무 게이트 없이 **모든 PR에서 도는 job(`verify`)은 크레덴셜을 쥐지 않는다.** 시크릿도
#        environment도 참조하지 않는다. tier는 어느 job에서든 리터럴이다 — 시크릿이 아니라 레포가
#        소유한 닫힌 유니온이고, job의 정체(어느 워커에 배포하나)가 곧 값이라 참조할 것이 없다.
#      • 보장하지 않음: `stg`는 `pull_request`로 도는 job이면서 `environment: staging`을 선언하므로
#        토큰을 받는다. 그 토큰은 계정 범위라 `vibe`도 쓸 수 있다. 즉 **라벨을 붙일 수 있는 사람은
#        이 파일을 고쳐 프로덕션 워커에 닿을 수 있다.** 그걸 막는 건 GitHub이 아니라 라벨을 붙일 권한
#        자체이고, 그 권한은 이미 `main`에 푸시할 수 있는 사람들의 것이다(collaborators.tf가 admin이
#        아니라 push를 주는 이유와 같은 계산). 익명 공격자에게는 닫혀 있고, 협업자에게는 신뢰가
#        경계다.
#    ⚠️ 위 첫 줄조차 **레포 레벨 `CLOUDFLARE_API_TOKEN`·`CLOUDFLARE_ACCOUNT_ID`가 존재하지 않을
#    때만** 성립한다. 레포 시크릿은 environment 없는 job에도 내려가므로 `verify`도 받게 된다. 값은
#    `production`·`staging` 환경 시크릿에만 둔다 — stella/zwds/horn도 같은 이유로 `production`
#    환경을 선언하도록 함께 바꿨다. 아래 `verify`의 첫 스텝이 이 전제가 깨졌는지 매번 확인한다.
#
# 롤백은 `wrangler rollback`이다(로컬 실행). 이 레포 규모에서 버전 업로드/승격 machinery가 살 이유가
# 롤백뿐인데 이미 명령이 있으므로, 여기에는 두지 않는다.
#
# `paths`가 두 번 적혀 있는 건 중복이 아니라 필요다 — GitHub Actions는 YAML 앵커를 지원하지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'apps/vibe/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/vibe-deploy.yml'
  # `labeled`가 있어야 라벨을 붙이는 순간 배포가 돈다. 나머지 셋은 `verify`용이고, 라벨을 이미 가진
  # PR에 새 커밋이 오면 `synchronize`가 스테이징을 최신으로 다시 올린다.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/vibe/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/vibe-deploy.yml'
  # 이 트리거의 ref는 GitHub 실행 화면에서 고른다. PR 없이 브랜치를 올려 보거나 스테이징을 특정
  # ref로 되돌릴 때 쓴다.
  workflow_dispatch:
    inputs:
      force:
        description: '다른 PR이 stg 라벨을 쥐고 있어도 강행한다'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 배포하지 않는 것이 이 job의 정체성이다. PR에서 배포를 떼어낸 대신, 배포만이 잡아 주던 두 가지를
  # 여기서 잡는다 — `next build` 자체의 실패와 유료 문항 텍스트 유출. lint.yml은 `bun run type`과
  # `bun test apps/vibe`까지만 돌고 빌드는 하지 않으므로, 이 job이 없으면 빌드 깨짐이 main에 머지된
  # 뒤 프로덕션 배포에서 처음 드러난다.
  #
  # tier를 GitHub Environment 변수가 아니라 매트릭스로 두는 이유: environment를 붙이는 순간 이 job이
  # 그 환경의 시크릿을 쥐게 되어 위 ②가 무너진다. `PayTier`는 레포가 소유한 닫힌 유니온이라 시크릿이
  # 아니고, 두 tier를 다 빌드하면 오히려 검증이 넓어진다 — 특히 유료 텍스트 유출 검사가 실제로
  # 프로덕션에 나갈 `live` 빌드에도 걸린다.
  verify:
    name: Verify vibe build (${{ matrix.tier }})
    # `labeled`는 `stg` job을 깨우려고 트리거에 넣은 것이지 코드가 바뀐 사건이 아니다. 여기서 걸러
    # 내지 않으면 아무 라벨이나 붙일 때마다 매트릭스 두 다리가 다시 돌고, cancel-in-progress가 같은
    # 커밋을 검증 중이던 실행을 취소해 PR 체크에 아무것도 검증하지 않은 취소 두 개가 남는다.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tier: [live, test]
    # 같은 PR의 옛 커밋 검증은 가치가 없으니 취소한다. 그룹이 PR 번호로 갈려 있어 남의 PR은 건드리지
    # 않는다 — 이전 파일이 `staging` 리터럴 하나를 쓰던 것과 정확히 반대다. tier까지 키에 넣지 않으면
    # 매트릭스 두 다리가 서로를 취소한다.
    concurrency:
      group: vibe-verify-${{ github.event.pull_request.number }}-${{ matrix.tier }}
      cancel-in-progress: true
    steps:
      # 이 job이 크레덴셜을 쥐지 않는다는 전제를 문서가 아니라 실행이 확인한다. 레포 레벨 시크릿은
      # environment 없는 job에도 내려오므로, 누가 되돌려 놓으면 여기서 값이 보이고 빌드가 선다.
      #
      # 한계를 정직하게: 이건 **되돌아옴에 대한 회귀 감지**이지 악의적 PR에 대한 방어가 아니다. PR은
      # 자기 사본에서 이 스텝을 지울 수 있다. 그래도 값어치가 있는 건, 실제로 일어날 법한 사고가
      # 공격이 아니라 "급해서 레포 시크릿에 다시 넣었다"이기 때문이다.
      - name: Assert this job holds no Cloudflare credential
        env:
          LEAKED_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEAKED_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$LEAKED_TOKEN" ] || [ -n "$LEAKED_ACCOUNT" ]; then
            echo "레포 레벨 Cloudflare 시크릿이 존재합니다 — environment 없는 job에도 내려가므로" >&2
            echo "값을 production·staging 환경 시크릿으로 옮기고 레포 레벨에서는 지우십시오." >&2
            exit 1
          fi
          echo "레포 레벨 Cloudflare 시크릿 없음"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_DEEPTYPE_PAY_TIER: ${{ matrix.tier }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/vibe build

      # The paid question text may not be readable in the static export. It rides in a lazily imported chunk,
      # so the only thing that catches an accidental server prop is a scan of what shipped — and it has to run
      # here rather than in lint.yml, which never builds. Between build and deploy: a leak must not ship.
      - name: Assert no paid question text in the static export
        run: bun run --filter=@sobok/vibe check:export

  stg:
    name: Deploy to staging (vibe-stg)
    # 포크 PR에는 시크릿이 내려가지 않아 배포 스텝에서 멈추므로, 조용히 건너뛴다. 협업자는
    # collaborator로 두고 브랜치를 이 레포에 직접 민다.
    #
    # `labeled` 조건이 따로 붙는 이유: 이미 `stg`를 가진 PR에 무관한 라벨을 붙여도 이벤트는 오고
    # labels 배열에는 여전히 `stg`가 있어서, 그것만으로는 같은 코드를 다시 올리게 된다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'stg') &&
       (github.event.action != 'labeled' || github.event.label.name == 'stg'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      # 아래 claim 스텝이 열려 있는 PR의 라벨을 읽는 데만 쓴다.
      pull-requests: read
    # 워커가 하나뿐이므로 그룹도 하나다. cancel-in-progress는 반드시 false — QA 중인 배포를 반쯤
    # 끊는 것은 덮어쓰기보다 나쁘다. `queue: max`는 대기 중인 실행을 100개까지 FIFO로 세운다.
    # 기본값 `single`은 대기 중인 것을 새 실행으로 **교체**하므로, 순서를 지키려면 명시해야 한다.
    # (`queue: max`와 `cancel-in-progress: true`의 조합은 워크플로 검증 에러다.)
    concurrency:
      group: vibe-stg
      queue: max
      cancel-in-progress: false
    steps:
      # 점유는 사회적 약속이 아니라 확인 가능한 사실이어야 한다. 두 PR이 라벨을 동시에 쥐면 여기서
      # 멈추고 누가 쥐고 있는지 번호를 대 준다. 라벨을 떼는 것이 곧 반납이다.
      #
      # 막는 것과 막지 않는 것을 분명히 해 두면:
      #   • 막는다 — 두 PR이 동시에 라벨을 쥐는 것. 그게 이 스텝의 전부다.
      #   • 막지 않는다 — 앞사람이 라벨을 뗀 직후 뒷사람이 올리는 것. 그건 정상적인 교대다.
      #   • 막지 않는다 — **수동 실행끼리**. `workflow_dispatch`는 라벨을 남기지 않으므로 점유를
      #     주장하지도 않고 남의 점유를 막지도 않는다(라벨을 쥔 PR이 있으면 여기서 멈추긴 한다).
      #     수동 실행은 잠금이 아니라 탈출구다 — 두 사람이 동시에 돌리면 `queue: max`가 순서만
      #     세워 주고 나중 것이 앞의 것을 대체한다. 점유가 필요하면 PR에 라벨을 붙인다.
      # 라벨을 떼도 워커는 마지막 배포를 계속 서빙한다(되돌리지 않는다). 반납은 다음 사람이 올릴 수
      # 있다는 뜻이지 스테이징이 비었다는 뜻이 아니다.
      - name: Claim the staging lane
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.event.pull_request.number }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # 조회와 필터를 한 파이프라인에 두지 않는 이유: `|| true`는 grep이 전부 걸러내 exit 1을 낼
          # 때만 필요한데, 같은 파이프라인에 붙이면 gh의 API 오류·레이트리밋·권한 축소·gh 부재까지
          # "아무도 안 쥐고 있음"으로 삼킨다. 잠금이 이 리라이트의 요점인데, 그 잠금이 장애 때 조용히
          # 사라지고 초록으로 통과한다 — 성공과 구분이 안 되므로 아무도 눈치채지 못한다. 조회가
          # 실패하면 `set -e`가 여기서 죽는 게 맞다.
          labeled=$(gh pr list --repo "$GITHUB_REPOSITORY" --label stg --state open --json number --jq '.[].number')
          holders=$(printf '%s\n' "$labeled" | grep -vx "${SELF:-}" || true)
          if [ -z "$holders" ]; then
            echo "스테이징 레인 점유 — 라벨을 쥔 다른 PR 없음"
            exit 0
          fi
          echo "다른 PR이 stg 라벨을 쥐고 있습니다: $(printf '%s\n' "$holders" | sed 's/^/#/' | tr '\n' ' ')" >&2
          if [ "${FORCE:-false}" = "true" ]; then
            echo "force 입력이 켜져 있어 강행합니다." >&2
            exit 0
          fi
          echo "그 PR에서 라벨을 떼고 다시 시도하거나, 수동 실행에서 force를 켜십시오." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 결제수단 메뉴는 정적 export에 구워지므로 어느 PortOne 설정 모드로 파는지를 빌드가 알아야 한다.
      # 워커 쪽 짝은 wrangler.jsonc `env.stg`의 `DEEPTYPE_PAY_TIER`이고, 둘이 어긋나면 페이월이 내놓은
      # 수단을 /checkout이 거절한다.
      #
      # 리터럴인 이유: 이 job의 정체가 이미 그 한 비트다. 아래 배포 스텝이 `--env stg`를 하드코딩하는
      # job에서 tier는 `test` 아닌 값일 수 없고, 배포 명령과 같은 job 안에 나란히 적혀 함께 읽힌다.
      # tier는 시크릿이 아니라 레포가 소유한 닫힌 유니온이라 environment 변수로 격리할 것도 없다 —
      # 이 값을 아는 것은 아무 권한도 아니고, 설정을 요구하는 순간 첫 배포가 빈 값으로 선다.
      - name: Build static export
        env:
          NEXT_PUBLIC_DEEPTYPE_PAY_TIER: test
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/vibe build

      - name: Assert no paid question text in the static export
        run: bun run --filter=@sobok/vibe check:export

      # A wrangler named environment is a SEPARATE Worker script: `deploy` ships `vibe`, `deploy --env stg`
      # ships `vibe-stg`. This job only ever addresses the latter.
      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/vibe
          packageManager: bun
          command: deploy --env stg

  production:
    name: Deploy to production (vibe)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # 어느 ref가 이 job으로 `production` 크레덴셜을 받는지는 이 파일의 조건식이 아니라 GitHub
    # Environment가 정한다 — `production`에 `main` 전용 브랜치 정책이 걸려 있어(sobok-ops
    # `infra/github/sobok2026`) 조건식을 지워도 다른 브랜치는 이 환경을 못 연다.
    #
    # 정확히 해 두면, 이건 "프로덕션 워커에 아무도 못 쓴다"가 아니라 "이 환경은 `main`만 연다"이다.
    # Cloudflare 토큰이 계정 범위라 `staging` 토큰으로도 `vibe`를 쓸 수는 있다 — 헤더 주석 ② 참고.
    environment: production
    # 연달아 머지되면 취소가 아니라 줄을 선다. 릴리스는 반쯤 나가서도, 건너뛰어져서도 안 된다.
    concurrency:
      group: vibe-production
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tier가 리터럴인 이유는 stg job의 같은 자리 주석 참고. `live`가 위험해지는 유일한 경로는 이
      # job이 실연동 채널 키로 배포까지 가는 것인데, 그 배포 스텝은 `production` 환경 시크릿 없이는
      # 돌지 못하고 그 환경은 `main`에만 열려 있다 — 지키는 것은 tier 값이 아니라 크레덴셜이다.
      - name: Build static export
        env:
          NEXT_PUBLIC_DEEPTYPE_PAY_TIER: live
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/vibe build

      - name: Assert no paid question text in the static export
        run: bun run --filter=@sobok/vibe check:export

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/vibe
          packageManager: bun
          command: deploy
