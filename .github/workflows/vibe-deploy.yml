name: Vibe Deploy

# `main` 푸시는 프로덕션(`vibe`), 그 외에는 스테이징(`vibe-stg`)으로 나간다.
#
# 스테이징은 기능 QA와 결제 QA를 모두 받는 환경이라 PR을 열면 자동으로 올라간다. 수동 실행은 PR 없이
# 브랜치를 올려 보거나 스테이징을 특정 ref로 되돌릴 때 쓴다. `pull_request`는 머지 결과물(merge commit)을
# 빌드하므로, QA가 확인하는 것이 실제로 머지됐을 때의 상태다.
#
# ⚠️ `vibe-stg` 워커는 하나뿐이다. PR 두 개가 동시에 QA를 받으면 나중 배포가 앞의 것을 덮는다 — 지금 뭐가
# 올라가 있는지는 레포의 Deployments에서 본다. 동시 QA가 일상이 되면 PR별 preview(`wrangler versions
# upload`)로 갈라야 하는데, 그때도 결제 경로만은 `vibe-stg`에 남는다: guardTurnstile이 호스트네임을
# DEEPTYPE_PUBLIC_ORIGIN에서 뽑아서 preview 호스트로는 결제창을 못 연다.
#
# 어느 환경으로 가는지는 워크플로 안의 약속이 아니라 GitHub Environment가 강제한다: `production` 환경에
# `main`만 배포할 수 있는 브랜치 정책이 걸려 있어(sobok-ops `infra/github/sobok2026`), 이 파일을 고쳐도
# 다른 브랜치가 실연동 채널 키에 닿지 못한다.
#
# PR 배포는 시크릿이 필요하므로 같은 레포의 브랜치여야 한다. 포크 PR에는 시크릿이 내려가지 않아 배포
# 스텝에서 멈춘다 — 협업자는 collaborator로 두고 브랜치를 이 레포에 직접 민다.
# `paths`가 두 번 적혀 있는 건 중복이 아니라 필요다 — GitHub Actions는 YAML 앵커를 지원하지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'apps/vibe/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/vibe-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/vibe/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/vibe-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 환경별로 그룹을 나눈다. 같은 ref에서 프로덕션 배포와 스테이징 수동 배포가 서로를 취소하면 안 된다.
  # 반면 스테이징끼리는 취소가 맞다 — 워커가 하나뿐이라 나중 실행이 어차피 앞의 것을 덮는다.
  group: vibe-deploy-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    environment: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/vibe build

      # The paid question text may not be readable in the static export. It rides in a lazily imported chunk,
      # so the only thing that catches an accidental server prop is a scan of what shipped — and it has to run
      # here rather than in lint.yml, which never builds. Between build and deploy: a leak must not ship.
      - name: Assert no paid question text in the static export
        run: bun run --filter=@sobok/vibe check:export

      # A wrangler named environment is a SEPARATE Worker script: `deploy` ships `vibe`, `deploy --env stg`
      # ships `vibe-stg`. One step chooses, so there is no path where both run.
      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/vibe
          packageManager: bun
          command: ${{ github.event_name == 'push' && 'deploy' || 'deploy --env stg' }}
