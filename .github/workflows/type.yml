name: Types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: type-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Until now nothing in CI ran tsc — the only gate was the .husky/pre-push hook, which `--no-verify`
      # skips. Deploy workflows build the app they deploy, so a type error in a package that no deploy
      # touches could reach main unnoticed.
      - name: Type check
        run: bun run type

      - name: Assert no generated-file drift
        run: git diff --exit-code
