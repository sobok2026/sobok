name: Zwds Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/zwds/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/zwds-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zwds-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    if: ${{ github.ref_name == 'main' }}
    # 크레덴셜은 environment에만 산다 — 이유는 stella-deploy.yml의 같은 자리 주석 참고.
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Build static export
        run: bun run --filter=@sobok/zwds build

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/zwds
          packageManager: bun
          command: deploy
