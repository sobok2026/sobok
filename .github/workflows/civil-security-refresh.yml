name: Civil security scanner refresh

on:
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobok-production
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild Civil artifact scanner
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rebuild compute Worker and scanner signatures
        uses: ./.github/actions/deploy-civil-compute
        with:
          target: production
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
