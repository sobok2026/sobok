name: Lint & Types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-type-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Biome + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI (format + lint + import order)
        run: bunx biome ci .

      - name: Prettier check (css, markdown, yaml, html)
        run: bunx prettier --check '**/*.{css,md,yml,yaml,html}' --ignore-path .gitignore

      # Until now nothing in CI ran tsc — the only gate was the .husky/pre-push hook, which `--no-verify`
      # skips. Deploy workflows build the app they deploy, so a type error in a package that no deploy
      # touches could reach main unnoticed.
      - name: Type check
        run: bun run type

      # Scoped to apps/vibe on purpose. The deep-type instrument is guarded almost entirely by assertions —
      # option polarity, reverse-flag pins, pole freeze, band cuts, claim boundaries — and none of them ran in
      # CI until now, so a sign inversion could reach main exactly the way `refine-gem-oa-3` already did.
      #
      # A repo-wide `bun test` is not the fix today: `apps/web` carries 23 pre-existing failures, and
      # `test/backend` needs the Postgres and Redis services that backend-integration.yml stands up. Widening
      # this step means fixing those first — do it, then drop the path filter.
      - name: Unit tests (apps/vibe)
        run: bun test apps/vibe

      - name: Assert no generated-file drift
        run: git diff --exit-code
