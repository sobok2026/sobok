name: Lint & Types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-type-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Biome + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      # Shared with the staging deployment preflight so an administrator fast-forward push and a pull request
      # are evaluated by the same repository-wide static checks.
      - name: Verify workspace
        uses: ./.github/actions/verify-workspace

      # Scoped to apps/vibe on purpose. The deep-type instrument is guarded almost entirely by assertions —
      # option polarity, reverse-flag pins, pole freeze, band cuts, claim boundaries — and none of them ran in
      # CI until now, so a sign inversion could reach main exactly the way `refine-gem-oa-3` already did.
      #
      # A repo-wide `bun test` is not the fix today: `apps/web` carries 23 pre-existing failures, and
      # `test/backend` needs the Postgres and Redis services that backend-integration.yml stands up. Widening
      # this step means fixing those first — do it, then drop the path filter.
      - name: Unit tests (apps/vibe)
        run: bun test apps/vibe

      - name: Assert no generated-file drift
        run: git diff --exit-code

  release-builds:
    name: Release builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      # Accounts public OAuth IDs are environment-scoped, so an artifact that will never deploy uses a
      # deliberately non-operational client id only to verify the static export on pull requests.
      - name: Build Accounts
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-release-build.apps.googleusercontent.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.ACCOUNTS_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/accounts build

      - name: Build Stella
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.STELLA_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/stella build

      - name: Build Vibe
        env:
          NEXT_PUBLIC_DEEPTYPE_PAY_PROFILE: ${{ github.base_ref == 'staging' && 'staging' || 'production' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/vibe build

      - name: Verify Vibe static export
        run: bun run --filter=@sobok/vibe check:export

      - name: Build ZWDS
        run: bun run --filter=@sobok/zwds build

      - name: Build Horn
        run: bun run --filter=@sobok/horn build

      - name: Assert no generated-file drift
        run: git diff --exit-code
