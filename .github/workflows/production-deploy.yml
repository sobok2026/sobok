name: Production Deploy

run-name: Manually release production @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to release every production app
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sobok-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Validate manual release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != 'refs/heads/main' ]; then
            echo 'Production releases must run from main.' >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != 'DEPLOY' ]; then
            echo 'Type DEPLOY to confirm the production release.' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Verify workspace
        uses: ./.github/actions/verify-workspace

      - name: Assert no generated-file drift
        run: git diff --exit-code

  oauth-client:
    name: Bootstrap production OAuth clients
    needs: verify
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Bootstrap fixed Stella client
        uses: ./.github/actions/bootstrap-oauth-client
        with:
          target: production
          accounts_migrator_url: ${{ secrets.ACCOUNTS_MIGRATOR_URL }}
          client_id: stella-web
          client_name: Stella
          client_origin: https://stella.sobok.cc
          client_secret: ${{ secrets.STELLA_OIDC_CLIENT_SECRET }}

      - name: Bootstrap fixed Civil client
        uses: ./.github/actions/bootstrap-oauth-client
        with:
          target: production
          accounts_migrator_url: ${{ secrets.ACCOUNTS_MIGRATOR_URL }}
          client_id: civil-web
          client_name: Civil
          client_origin: https://civil.sobok.cc
          client_secret: ${{ secrets.CIVIL_OIDC_CLIENT_SECRET }}

  payments:
    name: Deploy payments
    needs: oauth-client
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Payments Worker
        uses: ./.github/actions/deploy-payments
        with:
          target: production
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  database:
    name: Deploy Database Worker
    needs: payments
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Database Worker
        uses: ./.github/actions/deploy-database
        with:
          target: production
          accounts_google_client_id: ${{ vars.ACCOUNTS_GOOGLE_CLIENT_ID }}
          accounts_kakao_client_id: ${{ vars.ACCOUNTS_KAKAO_CLIENT_ID }}
          accounts_bbaton_client_id: ${{ vars.ACCOUNTS_BBATON_CLIENT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  accounts:
    name: Deploy Accounts
    needs: database
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Accounts
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/accounts'
          directory: apps/accounts
          target: production
          turnstile_site_key: ${{ vars.ACCOUNTS_TURNSTILE_SITE_KEY }}
          accounts_google_client_id: ${{ vars.ACCOUNTS_GOOGLE_CLIENT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  civil-compute:
    name: Deploy Civil compute
    needs: database
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Civil compute Worker and Container
        uses: ./.github/actions/deploy-civil-compute
        with:
          target: production
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  stella:
    name: Deploy Stella
    needs: [database, accounts]
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Stella
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/stella'
          directory: apps/stella
          target: production
          turnstile_site_key: ${{ vars.STELLA_TURNSTILE_SITE_KEY }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  civil:
    name: Deploy Civil
    needs: [database, accounts, civil-compute]
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Civil
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/civil'
          directory: apps/civil
          target: production
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  vibe:
    name: Deploy Vibe
    needs: database
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Vibe
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/vibe'
          directory: apps/vibe
          target: production
          turnstile_site_key: ${{ vars.VIBE_TURNSTILE_SITE_KEY }}
          vibe_pay_profile: production
          verify_export: 'true'
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  zwds:
    name: Deploy ZWDS
    needs: payments
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy ZWDS
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/zwds'
          directory: apps/zwds
          target: production
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  horn:
    name: Deploy Horn
    needs: payments
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and deploy Horn
        uses: ./.github/actions/deploy-app
        with:
          package_name: '@sobok/horn'
          directory: apps/horn
          target: production
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
