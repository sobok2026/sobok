name: App Deploy (Reusable)

on:
  workflow_call:
    inputs:
      package_name:
        description: Bun workspace package to build
        required: true
        type: string
      directory:
        description: App directory containing wrangler.jsonc
        required: true
        type: string
      target:
        description: production or staging
        required: true
        type: string
      database_schema:
        description: Build-time PostgreSQL schema, if the app uses one
        required: false
        default: ''
        type: string
      turnstile_site_key:
        description: Public Turnstile site key, if the app uses one
        required: false
        default: ''
        type: string
      vibe_pay_profile:
        description: Vibe static payment profile, if applicable
        required: false
        default: ''
        type: string
      verify_export:
        description: Run the app's check:export script after building
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.package_name }} (${{ inputs.target }})
    environment: ${{ inputs.target }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Validate deployment target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            production|staging) ;;
            *) echo "Unsupported deployment target: $TARGET" >&2; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Build static export
        env:
          NEXT_PUBLIC_DEEPTYPE_PAY_PROFILE: ${{ inputs.vibe_pay_profile }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}
          SOBOK_DB_SCHEMA: ${{ inputs.database_schema }}
        run: bun run --filter="${{ inputs.package_name }}" build

      - name: Verify static export
        if: inputs.verify_export
        run: bun run --filter="${{ inputs.package_name }}" check:export

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.directory }}
          packageManager: bun
          command: ${{ inputs.target == 'staging' && 'deploy --env stg' || 'deploy' }}
