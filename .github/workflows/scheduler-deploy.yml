name: Scheduler Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/scheduler/**'
      - 'packages/scheduler/**'
      - 'bun.lock'
      - '.github/workflows/scheduler-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: Deploy account scheduler
    if: github.event_name == 'push' || github.ref_name == 'main'
    environment: production
    concurrency:
      group: scheduler-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Check Worker contract
        run: bun --filter=@sobok/scheduler-service type

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/scheduler
          packageManager: bun
          command: deploy
