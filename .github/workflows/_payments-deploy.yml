name: Payments Deploy (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: GitHub Environment and Cloudflare deployment target
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy payments (${{ inputs.target }})
    environment: ${{ inputs.target }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Validate deployment target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            staging|production) ;;
            *) echo "Unsupported deployment target: $TARGET" >&2; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Check Worker contract
        run: bun --filter=@sobok/payments-service type

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/payments
          packageManager: bun
          command: ${{ inputs.target == 'staging' && 'deploy --env stg' || 'deploy' }}
