name: Stella Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/stella/**'
      - 'packages/domain/**'
      - 'bun.lock'
      - '.github/workflows/stella-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stella-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run --filter=@sobok/stella build
        env:
          # GTM container ID (public value) — repository variable; leave unset to ship without GTM.
          NEXT_PUBLIC_GTM_ID: ${{ vars.STELLA_GTM_ID }}

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/stella
          packageManager: bun
          command: deploy
