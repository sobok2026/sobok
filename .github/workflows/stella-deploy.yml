name: Stella Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/stella/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/stella-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stella-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    if: ${{ github.ref_name == 'main' }}
    # Cloudflare 크레덴셜은 environment에만 산다. 레포 시크릿은 environment를 선언하지 않은 job에도
    # 내려가고, 그런 job에는 PR이 고칠 수 있는 것(vibe-deploy.yml의 `verify`)이 섞여 있다 — 그래서
    # `CLOUDFLARE_API_TOKEN`·`CLOUDFLARE_ACCOUNT_ID`는 레포 레벨에 두지 않는다.
    #
    # 덤으로 위의 `if`가 혼자 지고 있던 짐을 GitHub이 나눠 진다. `workflow_dispatch`는 고른 ref의
    # 워크플로 파일을 실행하므로 그 조건식은 스스로를 지우는 커밋 앞에서 무력한데, `production`
    # 환경의 `main` 전용 브랜치 정책은 파일 밖에 있어서 지울 수 없다.
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.STELLA_TURNSTILE_SITE_KEY }}
        run: bun run --filter=@sobok/stella build

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/stella
          packageManager: bun
          command: deploy
