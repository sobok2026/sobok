name: Horn Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/horn/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/horn-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horn-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    if: ${{ github.ref_name == 'main' }}
    # 크레덴셜은 environment에만 산다 — 이유는 stella-deploy.yml의 같은 자리 주석 참고.
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run --filter=@sobok/horn build

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/horn
          packageManager: bun
          command: deploy
