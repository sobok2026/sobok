name: Set up Bun workspace
description: Install the repo-pinned Bun and reproducibly install the workspace from the committed lockfile.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun ci
